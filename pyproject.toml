[project]
name = "cas"
version = "0.1.0"
description = "Coordinated Agent Systems (CAS) - coordination layer reference implementation, spec v0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "jsonschema>=4.23",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pgserver>=0.1.4"]

[project.scripts]
cas = "cas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cas"]

[tool.pytest.ini_options]
testpaths = ["cas/tests"]
addopts = "-q"
